name: iOS unsigned build

# Builds an UNSIGNED .ipa on a macOS runner. Manual trigger only — no build
# runs (and no Actions minutes are spent) until you click "Run workflow" in
# the Actions tab.
#
# The .ipa produced here is unsigned. Sign + install it on an iPhone locally
# with Sideloadly or AltStore using a FREE Apple ID (no paid Apple Developer
# account needed). Free-Apple-ID installs expire after 7 days — re-sign the
# same .ipa locally to refresh (no rebuild required).
#
# NOTE: macOS runners bill at a 10x multiplier against the 2,000 free
# minutes/month. Prefer running after the monthly minute reset.

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: |
          ls /Applications | grep -i xcode || true
          echo "default xcodebuild:"; xcodebuild -version

      # Expo SDK 57 / RN 0.86 needs Swift 6.2 tools, which ship with Xcode 26.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (generate native ios/ project)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install

      - name: Build unsigned .app
        run: |
          NAME=$(basename "$(ls -d ios/*.xcworkspace | head -n1)" .xcworkspace)
          echo "Building scheme: $NAME"
          xcodebuild \
            -workspace "ios/$NAME.xcworkspace" \
            -scheme "$NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app into unsigned .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr FinanceTracker-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceTracker-ipa
          path: mobile/FinanceTracker-unsigned.ipa
          if-no-files-found: error
