<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen Name</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" />
  <link rel="stylesheet" href="assets/mock.css" />
  <style>
    /* Page-specific styles only. Reuse assets/mock.css classes first. */
  </style>
</head>
<body>
  <main class="mock-page">
    <p class="mock-intro">
      What this page shows. Source: <code>mobile/src/app/xxx.tsx</code>, <code>mobile/src/components/yyy.tsx</code>.
    </p>
    <div class="frames">

      <!-- One .frame per state / dialog -->
      <section class="frame">
        <div class="phone">
          <div class="status-bar"></div>
          <div class="screen">
            <header class="screen-header">
              <div class="screen-header__row">
                <h1 class="t-subtitle" style="margin:0">Title</h1>
                <button class="icon-btn" aria-label="Action"><span class="ms">tune</span></button>
              </div>
            </header>
            <!-- content -->
          </div>
          <nav class="tabbar" data-active="home" data-badge="12"></nav>

          <!-- Sheets / dialogs go inside .phone, after the tabbar:
          <div class="overlay">
            <div class="sheet">
              <div class="sheet-handle"></div>
              <div class="sheet__header"><span class="t-heading">Sheet title</span>
                <button class="icon-btn icon-btn--plain" aria-label="Close"><span class="ms">close</span></button></div>
              <div class="sheet__body">…</div>
            </div>
          </div>
          -->
        </div>
        <p class="frame-caption"><b>State name</b>One-line description of the state.</p>
      </section>

    </div>
  </main>
  <script src="assets/mock.js"></script>
</body>
</html>
