<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website mocks</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" />
  <link rel="stylesheet" href="../assets/mock.css" />
  <style>
    html, body { height: 100%; }
    body { display: grid; grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); background: var(--page-bg); }
    .v-bar {
      grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; background: var(--background-element); border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .v-bar a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .v-bar .seg { min-width: 0; }
    .v-bar .seg__item { cursor: pointer; padding: 2px 10px; flex: none; }
    .v-bar select { font: inherit; font-size: 13px; color: var(--text); background: var(--background-element); border: 1px solid var(--border-strong); border-radius: 8px; padding: 4px 8px; }
    .v-side { overflow-y: auto; padding: 12px; border-right: 1px solid var(--border); background: var(--background-element); }
    .v-page { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; color: var(--text); text-decoration: none; cursor: pointer; font-weight: 500; }
    .v-page:hover { background: var(--background-selected); }
    .v-page.is-active { background: var(--accent-muted); color: var(--accent); }
    .v-page .ms { font-size: 18px; }
    .v-states { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 8px 26px; }
    .v-state { padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .v-state:hover { background: var(--background-selected); color: var(--text); }
    .v-state.is-active { color: var(--accent); background: var(--background-selected); }
    .v-notes { margin-top: 16px; padding: 12px; border-top: 1px solid var(--border); font-size: 12px; line-height: 17px; color: var(--text-secondary); }
    .v-notes b { color: var(--text); font-weight: 500; }
    .v-stage { overflow: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .v-meta { font-size: 12px; color: var(--text-secondary); }
    .v-frame-wrap { position: relative; flex-shrink: 0; }
    .v-frame {
      position: absolute; top: 0; left: 0; transform-origin: 0 0;
      border: 1px solid var(--border-strong); border-radius: 14px; background: var(--background);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    }
    .v-frame.is-phone { border-radius: 28px; }
    @media (max-width: 760px) { body { grid-template-columns: minmax(0, 1fr); } .v-side { display: none; } }
  </style>
</head>
<body data-no-toolbar>
  <div class="v-bar">
    <a href="../index.html">← App mocks</a>
    <span class="t-small-em" style="color:var(--text)">Website mocks</span>
    <span style="flex:1"></span>
    <span class="muted">Width</span>
    <div class="seg" id="widths"></div>
    <span class="muted">Theme</span>
    <div class="seg" id="themes"></div>
    <span class="muted">Drive status</span>
    <select id="sync" aria-label="Drive save status">
      <option value="saved">Saved</option><option value="saving">Saving…</option><option value="unsaved">Unsaved changes</option>
      <option value="offline">Offline</option><option value="reconnect">Reconnect Drive</option><option value="conflict">Conflict (backstop)</option>
      <optgroup label="One device edits at a time"><option value="inuse">In use on phone (after sign-in)</option><option value="viewonly">View only</option><option value="moved">Editing moved to phone</option></optgroup>
    </select>
    <a id="open-direct" href="#" target="_blank">Open page ↗</a>
  </div>
  <nav class="v-side" id="pages"></nav>
  <div class="v-stage" id="stage">
    <span class="v-meta" id="meta"></span>
    <div class="v-frame-wrap" id="wrap"><iframe class="v-frame" id="frame" title="Mock page"></iframe></div>
  </div>

  <script>
    (function () {
      var PAGES = [
        { key: 'signin', label: 'Sign in & loading', icon: 'login' },
        { key: 'home', label: 'Home', icon: 'home' },
        { key: 'activity', label: 'Activity', icon: 'history' },
        { key: 'import', label: 'Import', icon: 'file_download' },
        { key: 'lending', label: 'Lending', icon: 'swap_horiz' },
        { key: 'settings', label: 'Settings', icon: 'settings' },
      ];
      var WIDTHS = [
        { key: '1440', label: 'Desktop', w: 1440, h: 900 },
        { key: '1280', label: 'Laptop', w: 1280, h: 800 },
        { key: '1024', label: 'Tablet ⟷', w: 1024, h: 768 },
        { key: '820', label: 'Tablet', w: 820, h: 1180 },
        { key: '390', label: 'Phone', w: 390, h: 844 },
      ];
      var THEMES = [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']];
      var q = new URLSearchParams(location.search);
      var cur = {
        page: q.get('page') || 'activity', state: q.get('state') || '', w: q.get('w') || '1440',
        theme: q.get('theme') || 'system', sync: q.get('sync') || 'saved',
      };
      var known = {}; // page -> states from the frame
      var frame = document.getElementById('frame');
      var wrap = document.getElementById('wrap');

      function applyViewerTheme() {
        if (cur.theme === 'system') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', cur.theme);
      }
      function src() {
        var p = new URLSearchParams();
        if (cur.state) p.set('state', cur.state);
        if (cur.theme !== 'system') p.set('theme', cur.theme);
        if (cur.sync !== 'saved') p.set('sync', cur.sync);
        var s = p.toString();
        return cur.page + '.html' + (s ? '?' + s : '');
      }
      function pushUrl() {
        var p = new URLSearchParams(cur);
        if (!cur.state) p.delete('state');
        history.replaceState(null, '', '?' + p.toString());
      }
      function size() {
        var d = WIDTHS.filter(function (x) { return x.key === cur.w; })[0] || WIDTHS[0];
        var stage = document.getElementById('stage');
        var avail = stage.clientWidth - 40;
        var scale = Math.min(1, avail / d.w);
        frame.style.width = d.w + 'px'; frame.style.height = d.h + 'px';
        frame.style.transform = 'scale(' + scale + ')';
        frame.classList.toggle('is-phone', d.w < 720);
        wrap.style.width = d.w * scale + 'px'; wrap.style.height = d.h * scale + 'px';
        document.getElementById('meta').textContent = d.label + ' · ' + d.w + ' × ' + d.h + (scale < 1 ? ' · shown at ' + Math.round(scale * 100) + '%' : '');
      }
      function load() {
        var s = src();
        if (frame.getAttribute('src') !== s) frame.setAttribute('src', s);
        document.getElementById('open-direct').href = s;
        pushUrl(); size(); renderSide(); renderBar();
      }
      function renderBar() {
        document.getElementById('widths').innerHTML = WIDTHS.map(function (x) {
          return '<span class="seg__item' + (x.key === cur.w ? ' is-selected' : '') + '" data-w="' + x.key + '">' + x.label + '</span>';
        }).join('');
        document.getElementById('themes').innerHTML = THEMES.map(function (t) {
          return '<span class="seg__item' + (t[0] === cur.theme ? ' is-selected' : '') + '" data-theme-key="' + t[0] + '">' + t[1] + '</span>';
        }).join('');
        document.getElementById('sync').value = cur.sync;
      }
      function renderSide() {
        var html = PAGES.map(function (p) {
          var active = p.key === cur.page;
          var st = known[p.key] || [];
          var curState = cur.state || (st[0] && st[0][0]);
          return '<a class="v-page' + (active ? ' is-active' : '') + '" data-page="' + p.key + '"><span class="ms">' + p.icon + '</span>' + p.label + '</a>' +
            (active && st.length ? '<div class="v-states">' + st.map(function (s) {
              return '<span class="v-state' + (s[0] === curState ? ' is-active' : '') + '" data-state="' + s[0] + '">' + s[1] + '</span>';
            }).join('') + '</div>' : '');
        }).join('');
        html += '<div class="v-notes"><b>How to review</b><br>Pick a page, then a state. Switch width to see desktop, tablet and phone layouts; ' +
          'the pages are real responsive HTML, so the layout changes at 1200px and 720px. <b>Drive status</b> previews the save indicator, the reconnect banner and the conflict dialog on any page. ' +
          'Rows, the detail panel tabs and the chart bars are clickable.<br><br>Plan: <code class="t-code">docs/WEB_PLAN.md</code></div>';
        document.getElementById('pages').innerHTML = html;
      }
      document.addEventListener('click', function (e) {
        var t;
        if ((t = e.target.closest('[data-page]'))) { cur.page = t.getAttribute('data-page'); cur.state = ''; load(); }
        else if ((t = e.target.closest('[data-state]'))) { cur.state = t.getAttribute('data-state'); load(); }
        else if ((t = e.target.closest('[data-w]'))) { cur.w = t.getAttribute('data-w'); load(); }
        else if ((t = e.target.closest('[data-theme-key]'))) { cur.theme = t.getAttribute('data-theme-key'); applyViewerTheme(); load(); }
      });
      document.getElementById('sync').addEventListener('change', function (e) { cur.sync = e.target.value; load(); });
      window.addEventListener('message', function (e) {
        var d = e.data || {};
        if (d.type !== 'mock-ready') return;
        if (d.page && d.page !== cur.page) {
          // Navigated inside the frame (sidebar link etc.): follow it without reloading.
          cur.page = d.page; cur.state = (d.state && d.states && d.states[0] && d.state !== d.states[0][0]) ? d.state : '';
          cur.sync = d.sync || cur.sync;
          frame.setAttribute('src', src()); document.getElementById('open-direct').href = src(); pushUrl(); renderBar();
        }
        known[cur.page] = d.states || [];
        renderSide();
      });
      window.addEventListener('resize', size);
      applyViewerTheme();
      load();
    })();
  </script>
</body>
</html>
